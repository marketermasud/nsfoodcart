<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অর্ডার ট্র্যাক করুন | NS Food Cart</title>
<meta name="description" content="অর্ডার নম্বর দিয়ে দেখুন আপনার খাবার এখন কোথায় আছে।">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140b0b">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --coal:#140b0b; --coal-2:#1f1212; --coal-3:#2b1a1a; --line:#3d2525;
  --red:#d81f26; --gold:#f2b632; --cream:#fff4e6; --muted:#c9b3a6;
  --display:"Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{max-width:100%}
body{overflow-x:hidden;overflow-x:clip}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--coal);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(60rem 30rem at 110% -5%,rgba(216,31,38,.28),transparent 60%),radial-gradient(40rem 26rem at -15% 30%,rgba(216,31,38,.16),transparent 60%);
  background-attachment:fixed;padding-bottom:90px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

.announce{background:var(--red);color:#fff;text-align:center;padding:7px 16px;font-size:15px;font-weight:500}
.demo{background:var(--gold);color:#221;text-align:center;padding:6px 16px;font-size:14px}

header.top{position:sticky;top:0;z-index:30;background:rgba(20,11,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto;min-width:0}
.mark{width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;font:700 19px/1 var(--display);font-style:italic;flex:none;overflow:hidden;background:#000;
  box-shadow:0 0 18px rgba(216,31,38,.55)}
.mark img{width:100%;height:100%;object-fit:cover}
.brand b{font:700 20px/1.1 var(--display);display:block;white-space:nowrap}
.brand small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{white-space:nowrap;flex:none;border:0;border-radius:999px;padding:10px 20px;font-weight:600;background:var(--red);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--cream)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#241a05}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.cartbtn .n{background:#fff;color:var(--red);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:14px;padding:0 6px}

/* hero */
.closedbar{background:#000;color:#ff9c9c;border-bottom:2px solid var(--red);text-align:center;padding:10px 16px;font-weight:600}
.hero{position:relative;overflow:hidden;min-height:min(80vh,660px);display:flex;align-items:center;padding:60px 0 70px;isolation:isolate}
.slides{position:absolute;inset:0;z-index:-3}
.slide{position:absolute;inset:0;background-size:cover;background-position:60% center;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(20,11,11,.95) 0%,rgba(20,11,11,.8) 40%,rgba(20,11,11,.18) 100%),linear-gradient(0deg,var(--coal) 0%,transparent 26%)}
#embers{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.hero .wrap{width:100%}
.hero .txt{max-width:640px}
.status{display:inline-flex;align-items:center;gap:9px;font-size:15.5px;margin-bottom:18px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:999px;padding:7px 16px}
.status.closed{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:pulse 2s infinite;flex:none}
.dot.off{background:#fff;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.hero h1{font-size:clamp(40px,7.2vw,78px);font-weight:800;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 3px 0 #000,0 0 40px rgba(216,31,38,.55)}
.hero p{color:#e6d5c8;max-width:32em;margin:16px 0 26px;font-size:18.5px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn.ghost{background:rgba(0,0,0,.45);border-color:rgba(255,244,230,.35)}
.dots{display:flex;gap:8px;margin-top:34px;min-height:5px}
.dots button{width:28px;height:5px;border-radius:9px;border:0;background:rgba(255,244,230,.3);padding:0;transition:width .3s}
.dots button.on{background:var(--gold);width:48px}
.feats{padding:0;margin-top:-26px;position:relative;z-index:2}
.feats .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#2a1213,var(--coal-2) 65%)}
.feat svg{width:36px;height:36px;flex:none;color:var(--gold)}
.feat b{display:block;font:700 18px/1.3 var(--display)}
.feat span{color:var(--muted);font-size:15px;line-height:1.45;display:block}
.nowband{padding:44px 0 6px}
.nowband h2{font-size:15.5px;font-weight:500;font-family:var(--body);color:var(--muted)}
.nowband h3{font-size:36px;color:var(--gold);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pc{background:var(--coal-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pc.out{opacity:.5}
.pc .pic{aspect-ratio:4/3;background:radial-gradient(circle at 50% 60%,#3a1516,#0c0606 70%);display:grid;place-items:center;overflow:hidden;color:var(--gold)}
.pc .pic img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pc:hover .pic img{transform:scale(1.06)}
.pc .pic svg{width:44%;opacity:.85}
.pc .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc .nm{font-weight:600;line-height:1.3;font-size:17.5px}
.pc .f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.pc .pr{font:700 21px var(--display);color:var(--gold)}

/* "এখন চলছে" বোর্ড — ফুড কার্টের চকবোর্ডের মতো */
.board{background:#0c0606;border:2px solid var(--red);border-radius:16px;padding:22px 22px 14px;transform:rotate(1.2deg);
  box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 60px rgba(216,31,38,.25)}
.board h2{font-size:15px;font-weight:600;font-family:var(--body);color:var(--muted)}
.board h3{font-size:30px;color:var(--gold);margin:2px 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.row .thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;flex:none}
.row .thumb.ph{background:radial-gradient(circle at 50% 60%,#3a1516,#0c0606 75%);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.row .thumb.ph svg{width:56%;opacity:.8}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:17.5px;line-height:1.3}
.row .ds{color:var(--muted);font-size:14px;line-height:1.35}
.row .pr{font:700 19px var(--display);color:var(--gold);white-space:nowrap}
.row .pr s{color:var(--muted);font-size:14px;font-weight:600;margin-right:4px}
.row.out{opacity:.5}
.add{border:1.5px solid var(--red);background:transparent;color:var(--cream);border-radius:999px;height:40px;padding:0 16px;font-weight:600;white-space:nowrap}
.add:hover{background:var(--red)}
.qty{display:inline-flex;align-items:center;background:var(--red);border-radius:999px;height:40px}
.qty button{background:none;border:0;color:#fff;width:38px;height:40px;font-size:21px;line-height:1}
.qty span{min-width:22px;text-align:center;font-weight:600}
.tag{font-size:12.5px;background:var(--gold);color:#241a05;border-radius:6px;padding:1px 7px;font-weight:600;margin-left:6px;vertical-align:2px}

/* ক্যাটাগরি চিপ */
.chips{position:sticky;top:66px;z-index:20;background:rgba(20,11,11,.94);border-bottom:1px solid var(--line)}
.chips .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chips .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-size:15.5px;font-weight:500;color:var(--muted)}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold)}

/* মেনু — পোস্টারের মতো সেকশন শিরোনাম */
.menu{padding:26px 0 10px}
.sec{margin:30px 0 8px}
.sec h2{display:flex;align-items:center;gap:16px;color:var(--gold);font-size:30px;font-weight:700}
.sec h2::before,.sec h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--red))}
.sec h2::after{transform:scaleX(-1)}
.sec .hint{text-align:center;color:var(--muted);font-size:14.5px;margin:2px 0 6px}
.list{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
.list .row:nth-child(-n+2){border-top:0}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* ট্র্যাকিং */
.track{margin:54px 0 0;background:var(--coal-2);border-block:1px solid var(--line);padding:44px 0}
.track h2{font-size:34px}
.track p.lead{color:var(--muted);margin:6px 0 18px}
.tform{display:flex;gap:10px;max-width:520px}
.field{width:100%;background:#0c0606;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.field:focus{border-color:var(--gold);outline:0}
.mine{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted);align-items:center}
.mine button{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--cream);font-size:14.5px}
.tres{margin-top:26px;max-width:640px}
.tcard{background:#0c0606;border:1px solid var(--line);border-radius:16px;padding:22px}
.tcard .no{font:800 28px var(--display);letter-spacing:.02em}
.tcard .now{color:var(--gold);font:700 22px var(--display);margin:2px 0 16px}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:8px 0 24px 56px;color:var(--muted);min-height:64px;animation:rise .45s both}
.steps li:nth-child(2){animation-delay:.08s}.steps li:nth-child(3){animation-delay:.16s}.steps li:nth-child(4){animation-delay:.24s}.steps li:nth-child(5){animation-delay:.32s}
.steps .ic{position:absolute;left:0;top:0;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--coal);display:grid;place-items:center;color:var(--muted)}
.steps .ic svg{width:23px;height:23px}
.steps li::after{content:"";position:absolute;left:20px;top:44px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child{padding-bottom:0;min-height:42px}.steps li:last-child::after{display:none}
.steps li.done{color:var(--cream)}
.steps li.done .ic{background:var(--red);border-color:var(--red);color:#fff}
.steps li.done::after{background:var(--red)}
.steps li.cur{font-weight:600;color:var(--cream)}
.steps li.cur .ic{background:var(--gold);border-color:var(--gold);color:#241a05;animation:glow 1.6s ease-out infinite}
.steps li.cur .ic svg{animation:bob 1.2s ease-in-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(242,182,50,.55)}100%{box-shadow:0 0 0 12px rgba(242,182,50,0)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.tscene{height:104px;border-radius:14px;background:radial-gradient(circle at 50% 130%,#4a1a1b,#0c0606 70%);border:1px solid var(--line);margin:0 0 22px;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--gold)}
.tscene svg{width:64px;height:64px}
.tscene.wait svg{animation:bob2 1.3s ease-in-out infinite}
.tscene.pop svg{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.tscene .stm,.steps .cur .stm{animation:steam 1.3s ease-in-out infinite}
.tscene.ride::after{content:"";position:absolute;left:0;right:0;bottom:18px;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 20px,transparent 20px 36px);animation:road .5s linear infinite}
.tscene.ride svg{position:absolute;bottom:19px;left:-70px;animation:ride 4.2s linear infinite}
.tscene.ride .whl{animation:none}
@keyframes ride{from{left:-70px}to{left:100%}}
@keyframes road{to{background-position:-36px 0}}
@keyframes bob2{50%{transform:translateY(-7px)}}
.steps time{display:block;font-size:13.5px;font-weight:400;color:var(--muted)}
.tsum{border-top:1px dashed var(--line);margin-top:18px;padding-top:14px;font-size:15.5px;color:var(--muted)}
.tsum b{color:var(--cream)}
.bad{color:#ff8d8d}

footer{padding:44px 0 30px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:34px}
footer h3{font-size:19px;color:var(--gold);margin-bottom:8px}
footer p{margin:0 0 6px;color:var(--muted);font-size:16px}
footer a{color:var(--cream)}
.copy{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.copy a{color:var(--muted)}

/* আইটেমের পাতা + রিভিউ */
.lead{color:var(--muted)}
[data-item]{cursor:pointer}
.rt{color:var(--gold);font-size:14px;line-height:1.5}
.rt.none{color:var(--muted)}
.pm{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}
.pmbox{background:var(--coal-2);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:90dvh;overflow:auto;position:relative;animation:rise .25s both}
.pmbox .pimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.pm .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);border-radius:50%;color:#fff;z-index:2}
.pmbody{padding:20px}
.pmbody h2{font-size:28px;padding-right:44px}
.pmbody .ds{color:var(--muted);margin:4px 0 0}
.pmtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 0}
.pmtop .pr{font:700 27px var(--display);color:var(--gold)}
.pmbody h3{font-size:20px;margin:20px 0 8px;padding-top:18px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pmbody h3 small{font:500 15px var(--body);color:var(--muted)}
.rev{padding:12px 0;border-top:1px solid var(--line)}
.rev:first-child{border-top:0;padding-top:2px}
.rev .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rev time{color:var(--muted);font-size:13.5px}
.rev p{margin:4px 0 0;color:#e6d5c8;overflow-wrap:anywhere}
.stars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.stars i{color:var(--line);font-style:normal}
.pick{display:flex;gap:2px}
.pick button{background:none;border:0;font-size:36px;line-height:1;color:var(--line);padding:2px 5px}
.pick button.on{color:var(--gold)}
/* অনুষ্ঠানের অর্ডার */
.event{padding:44px 0 0}
.evbox{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 28px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(120deg,#5a1215,#2a1213 55%,var(--coal-2))}
.evbox h2{font-size:30px}
.evbox p{color:#e6d5c8;margin:6px 0 0;max-width:36em}
.evlist{max-height:42dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:14px 0 10px}
.evlist .row:first-child{border-top:0}
.evq{display:flex;align-items:center;gap:4px;flex:none}
.evq button{width:40px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:none;font-size:21px;line-height:1}
.evq input{width:60px;text-align:center;min-height:42px;padding:4px;border-radius:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>div{min-width:0}
.field{color-scheme:dark}
/* মোবাইলের নিচের মেনু */
.bnav,.call-m{display:none}
.track-link svg,.cartbtn .ci{display:none;width:23px;height:23px;flex:none}
/* ছাড়ের অফার */
.offbar{background:linear-gradient(90deg,#7a1418,#d81f26,#7a1418);color:#fff;text-align:center;padding:8px 16px;font-weight:600;font-size:15.5px}
.offbar b{color:var(--gold)}
.offbox{background:radial-gradient(circle at 50% 0,#7a1418,var(--coal-2) 62%);border:2px solid var(--gold);border-radius:22px;width:min(420px,100%);padding:30px 26px 26px;text-align:center;position:relative;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.offpct{font:800 86px/1 var(--display);color:var(--gold);text-shadow:0 4px 0 #000,0 0 40px rgba(242,182,50,.45)}
.offpct small{display:block;font-size:26px;color:#fff;margin-top:4px;text-shadow:none}
.offbox h2{font-size:27px;margin:14px 0 6px}
.offbox p{color:#e6d5c8;margin:0 0 6px}
.offbox .btn{margin-top:16px;font-size:19px;min-height:54px}
.disc{color:var(--gold)}
/* কার্ট বার + ড্রয়ার */
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;max-width:560px;margin:0 auto;
  background:var(--red);color:#fff;border:0;border-radius:16px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--coal-2);z-index:60;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .25s ease;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:24px}
.x{background:none;border:0;font-size:30px;line-height:1;width:44px;height:44px;color:var(--muted)}
.dbody{flex:1;overflow:auto;padding:8px 20px 20px}
.dfoot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--coal-3)}
.sum{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin-bottom:4px}
.sum.total{color:var(--cream);font:700 22px var(--display);margin:8px 0 12px}
label.l{display:block;font-size:15px;font-weight:500;margin:14px 0 5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1.5px solid var(--line);border-radius:12px;padding:11px;text-align:center;cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{color:var(--gold)}
.seg label:has(input:checked){border-color:var(--gold);background:rgba(242,182,50,.08)}
.seg label:has(input:focus-visible){outline:3px solid var(--gold)}
.note{font-size:14.5px;color:var(--muted);margin-top:8px}
.err{color:#ff8d8d;font-size:15px;margin-top:10px}
.okbox{text-align:center;padding:26px 0}
.okbox .big{font:800 44px var(--display);color:var(--gold);letter-spacing:.03em;margin:8px 0}
.okbox p{color:var(--muted);margin:0 0 16px}
.okbox .btn{margin-top:8px}
.cook{text-align:center;padding:46px 0}
.cook p{color:var(--muted);margin:0}
.cook b{display:block;font:700 23px var(--display);margin-bottom:4px}
.ring{width:156px;height:156px;margin:0 auto 22px;position:relative;display:grid;place-items:center;color:var(--gold)}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:6px solid var(--line);border-top-color:var(--red);border-right-color:var(--gold);animation:spin 1s linear infinite}
.ring svg{width:84px}
.ring .stm{animation:steam 1.3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes steam{0%{transform:translateY(5px);opacity:0}50%{opacity:1}100%{transform:translateY(-7px);opacity:0}}
.tick{width:92px;height:92px;border-radius:50%;background:#1b8a4b;display:grid;place-items:center;margin:0 auto 14px;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.tick svg{width:50px}
.tick path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .35s forwards}
@keyframes pop{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
.okbox .big{animation:rise .5s .55s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--cream);color:#221;padding:9px 18px;border-radius:999px;font-weight:500;z-index:80;font-size:15.5px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}

@media (max-width:820px){
  .hero{padding:40px 0 60px;min-height:0}
  .hero::before{background:linear-gradient(0deg,var(--coal) 0%,rgba(20,11,11,.7) 30%,rgba(20,11,11,.82) 100%)}
  .feats .wrap{grid-template-columns:1fr;gap:10px}
  .cards{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:64%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}
  .pc{scroll-snap-align:start}
  .nowband h3{font-size:30px}
  .list{grid-template-columns:1fr}
  .list .row:nth-child(2){border-top:1px dashed var(--line)}
  .fgrid{grid-template-columns:1fr;gap:22px}
  .brand small{max-width:150px}
  .sec h2{font-size:26px}
  .drawer{top:auto;height:92dvh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(102%)}
}
@media (max-width:820px){
  .g2{grid-template-columns:1fr;gap:0}
  .evbox{padding:22px 20px}.evbox h2{font-size:26px}.evbox .btn{width:100%}
  .evq button{width:36px}.evq input{width:52px}
  .pm{place-items:end center;padding:0}
  .pmbox{border-radius:20px 20px 0 0;max-height:92dvh;border-width:1px 0 0}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:#0c0606;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bnav a,.bnav button{background:none;border:0;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:12.5px;font-weight:500;position:relative;min-height:56px}
  .bnav svg{width:24px;height:24px}
  .bnav .on{color:var(--gold)}
  .bnav .n{position:absolute;top:4px;left:calc(50% + 5px);background:var(--red);color:#fff;border-radius:99px;min-width:19px;height:19px;font-size:11.5px;display:grid;place-items:center;padding:0 5px}
  .cartbar{bottom:calc(66px + env(safe-area-inset-bottom))}
  body{padding-bottom:150px}
  .toast{bottom:146px}
  .top .wrap{gap:8px;padding:0 14px}
  .brand{gap:9px}
  .brand>span:last-child{min-width:0}
  .brand b{font-size:18px;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:none}
  .top .track-link{padding:0;width:46px;min-height:46px}
  .top .track-link .tl,.top .cartbtn .cw{display:none}
  .track-link svg,.cartbtn .ci{display:block}
  .top .cartbtn{padding:0 12px;min-height:46px;gap:6px}
  .pm.off{place-items:center;padding:18px}
  .hero h1{font-size:clamp(34px,10vw,52px)}
  .hero p{font-size:17px}
  .row{gap:10px}
  .row .thumb{width:60px;height:60px}
  .add{padding:0 13px;font-size:15.5px}
  .tform{flex-direction:column}
  .tform .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tscene.ride svg{left:calc(50% - 32px)}.tick path{stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
<style>
body{padding-bottom:50px}
.thero{position:relative;padding:54px 0 74px;text-align:center;isolation:isolate;overflow:hidden}
.thero::before{content:"";position:absolute;inset:0;z-index:-2;background:#3a1012 url("https://images.unsplash.com/photo-1464500650248-1a4b45debb9f?auto=format&fit=crop&w=1600&q=70") center/cover}
.thero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,11,11,.72),rgba(20,11,11,.88) 62%,var(--coal))}
.thero h1{font-size:clamp(32px,7.5vw,54px);text-shadow:0 3px 0 #000,0 0 40px rgba(216,31,38,.5)}
.thero .lead{color:#e6d5c8;margin:10px auto 24px;max-width:30em;font-size:18px}
.thero .tform{margin:0 auto}
.thero .field{background:rgba(12,6,6,.85);text-align:center;font-size:19px;letter-spacing:.04em}
.thero .mine{justify-content:center;margin-top:16px}
.tres{max-width:600px;margin:-40px auto 0;padding:0 20px;position:relative}
.tres>p{text-align:center;margin:64px 0 0}
.tcard{box-shadow:0 24px 60px rgba(0,0,0,.65);border-color:#5a2a2a}
.tcard .no,.tcard .now{text-align:center}
.tcard .no{font-size:32px}
.tsum{text-align:center}
.tfood{display:flex;justify-content:center;gap:18px;margin:44px auto 0;padding:0 20px}
.tfood span{width:104px;height:104px;border-radius:50%;background:#2a1213 center/cover;border:3px solid var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.tfood span:nth-child(2){transform:translateY(-12px)}
.tmore{text-align:center;margin:26px 20px 0;color:var(--muted)}
.tmore .btn{margin-top:12px}
@media (max-width:820px){.thero{padding:38px 0 66px}.tfood span{width:88px;height:88px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark" id="mark"><img src="icons/logo-mark.jpg" alt=""></span>
      <span><b id="sName">NS Food Cart</b><small id="sTag">Fresh Food • Happy Mood</small></span>
    </a>
    <a class="btn ghost" href="index.html#menu">মেনু দেখুন</a>
  </div>
</header>
<main>
  <section class="thero" id="track">
    <div class="wrap">
      <h1 id="trackTitle"></h1>
      <p class="lead" id="trackLead"></p>
      <form class="tform" id="tForm">
        <input class="field" id="tNo" placeholder="যেমন NS-482913" autocomplete="off" inputmode="text" aria-label="অর্ডার নম্বর" required>
        <button class="btn">ট্র্যাক করুন</button>
      </form>
      <div class="mine hidden" id="mine"></div>
    </div>
  </section>
  <div class="tres" id="tRes" aria-live="polite"></div>
  <div class="tfood" aria-hidden="true">
    <span style="background-image:url('https://images.unsplash.com/photo-1631515243349-e0cb75fb8d3a?auto=format&fit=crop&w=300&h=300&q=70')"></span>
    <span style="background-image:url('https://images.unsplash.com/photo-1760008018988-9a8d0bf45552?auto=format&fit=crop&w=300&h=300&q=70')"></span>
    <span style="background-image:url('https://images.unsplash.com/photo-1464500650248-1a4b45debb9f?auto=format&fit=crop&w=300&h=300&q=70')"></span>
  </div>
  <p class="tmore">অপেক্ষার ফাঁকে মেনুটা আরেকবার দেখে নিন।<br><a class="btn ghost" href="index.html#menu">মেনু দেখুন</a></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/store.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, esc=Store.esc, tk=Store.tk, bn=Store.bn;
var S=Object.assign({},Store.defaults), mine=[];
try{mine=JSON.parse(localStorage.getItem('nsfc_orders'))||[]}catch(e){}
function shell(){
  document.documentElement.style.setProperty('--red',S.accent||'#d81f26');
  $('#sName').textContent=S.name;$('#sTag').textContent=S.tagline;
  $('#mark').innerHTML='<img src="'+esc(S.logo||'icons/logo-mark.jpg')+'" alt="">';
  $('#trackTitle').textContent=S.trackTitle;$('#trackLead').textContent=S.trackLead;
}
Store.watchSettings(function(s){S=s;shell()});
/* ---------- ট্র্যাকিং ---------- */
var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var TI={
  pending:SV+'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9.5 4h5v2.6h-5zM9 11h6M9 15h4"/></svg>',
  confirmed:SV+'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  preparing:SV+'<path d="M3 18h18M5 18a7 7 0 0 1 14 0M2 21h20"/><path class="stm" d="M9 7.5q-1.5-2 0-4M12 7.5q-1.5-2 0-4M15 7.5q-1.5-2 0-4"/></svg>',
  ontheway:SV+'<circle cx="5.5" cy="18" r="2.6"/><circle cx="18.5" cy="18" r="2.6"/><path d="M8.1 18h7.8M15.9 18l-1.6-7h2.4M5.5 15.4c.2-2 1.6-3.2 3.6-3.2h3.4l1.8 3.2"/><rect x="2.5" y="7.2" width="5.6" height="5" rx="1"/><circle cx="12" cy="4.6" r="1.7"/><path d="M12 6.6l-.6 3.4 2.9 1"/></svg>',
  bag:SV+'<path d="M5 8h14l-1.2 13H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8M9.5 13.5l2 2 3.5-4"/></svg>',
  delivered:SV+'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8.5 14.5l2.5 2.5 4.5-5"/></svg>',
  cancelled:SV+'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'
};
function tIcon(st,type){return TI[(type==='pickup'&&st==='ontheway')?'bag':st]||TI.pending}
function tScene(st,type){
  var cls=st==='ontheway'?(type==='pickup'?'wait':'ride'):(st==='confirmed'||st==='delivered'||st==='cancelled')?'pop':'wait';
  return '<div class="tscene '+cls+'">'+tIcon(st,type)+'</div>';
}
var unsub=null;
function drawMine(){
  var m=$('#mine');m.classList.toggle('hidden',!mine.length);
  m.innerHTML='আপনার আগের অর্ডার: '+mine.map(function(n){return '<button type="button" data-no="'+esc(n)+'">'+esc(n)+'</button>'}).join('');
}
$('#mine').onclick=function(e){var b=e.target.closest('[data-no]');if(b)track(b.dataset.no)};
$('#tForm').onsubmit=function(e){e.preventDefault();track($('#tNo').value)};
function track(raw){
  var no=Store.normNo(raw),R=$('#tRes');
  $('#tNo').value=no;if(unsub){unsub();unsub=null}
  if(!/^NS-\d{6}$/.test(no)){R.innerHTML='<p class="bad">অর্ডার নম্বর এমন হবে: NS-482913। নম্বরটা মিলিয়ে আবার লিখুন।</p>';return}
  R.innerHTML='<p class="lead">খোঁজা হচ্ছে…</p>';
  unsub=Store.watchTracking(no,function(o){
    if(!o){R.innerHTML='<p class="bad">'+esc(no)+' নম্বরে কোনো অর্ডার পাওয়া যায়নি। নম্বরটা মিলিয়ে দেখুন।</p>';return}
    var at={};(o.history||[]).forEach(function(h){at[h.status]=h.at});
    var cancelled=o.status==='cancelled',idx=Store.FLOW.indexOf(o.status);
    var steps=Store.FLOW.map(function(s,i){
      var cls=cancelled?'':(i<idx?'done':i===idx?(s==='delivered'?'done cur':'cur'):'');
      return '<li class="'+cls+'"><span class="ic">'+tIcon(s,o.type)+'</span>'+esc(Store.statusLabel(s,o.type))+(at[s]&&i<=idx?'<time>'+esc(Store.time(at[s]))+'</time>':'')+'</li>'}).join('');
    R.innerHTML='<div class="tcard"><div class="no">'+esc(o.orderNo)+'</div>'+
      '<div class="now'+(cancelled?' bad':'')+'">'+(cancelled?'অর্ডারটি বাতিল হয়েছে':esc(Store.statusLabel(o.status,o.type)))+'</div>'+
      tScene(o.status,o.type)+
      (cancelled?'<p class="lead">কোনো প্রশ্ন থাকলে কল করুন '+esc(S.phone)+'।</p>':'<ol class="steps">'+steps+'</ol>')+
      '<div class="tsum">'+(o.items||[]).map(function(i){return esc(i.name)+' × '+bn(i.qty)}).join(', ')+
      (Number(o.discount)?'<br>ছাড় −'+tk(o.discount):'')+'<br><b>মোট '+tk(o.total)+'</b> ('+(o.type==='pickup'?'দোকান থেকে নেবেন':'হোম ডেলিভারি')+')</div></div>';
  });
}
drawMine();shell();
var q=new URLSearchParams(location.search).get('order');
if(q)track(q);else if(mine.length)track(mine[0]);
})();
</script>
</body>
</html>
